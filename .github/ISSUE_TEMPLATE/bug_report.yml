name: Bug report
description: Something in the graph does not work, or does the wrong thing.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Most of this form is optional — fill in what you
        can and send it; a partial report is far better than none.

        If this is a security issue, please write to vesangelovdev@gmail.com
        instead of filing it here. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        I right-clicked a branch and chose Delete. I expected it to be deleted,
        but instead …
    validations:
      required: true

  - type: textarea
    id: git-output
    attributes:
      label: Git output
      description: |
        Open the graph, go to **More → Show Git Output**, and paste what it
        printed for the command that went wrong. It lists every git command the
        extension ran, so this is usually the fastest route to a fix.
      render: shell

  - type: input
    id: extension-version
    attributes:
      label: Git Graph Next version
      placeholder: '1.0.0'

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: '**Help → About**, or `code --version`. VSCodium and other builds are fine — say which.'
      placeholder: '1.96.2'

  - type: input
    id: git-version
    attributes:
      label: git version
      description: 'The output of `git --version`.'
      placeholder: 'git version 2.47.1'

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other

  - type: dropdown
    id: remote
    attributes:
      label: Where is the repository?
      description: Remote windows behave differently enough to be worth knowing.
      options:
        - On this machine
        - Remote - SSH
        - WSL
        - Dev Container
        - Codespaces
        - Other

  - type: textarea
    id: repository
    attributes:
      label: About the repository
      description: |
        Only if it seems relevant — roughly how many commits and branches, and
        anything unusual about it (submodules, a worktree, a very deep history,
        non-ASCII branch names, a detached HEAD).

  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: Any `git-graph-next.*` settings you have changed from their defaults.
      render: json
